quarkus.application.name=logtrack-backend

# --- Datasource ---
# %dev and %test leave jdbc.url unset on purpose: Quarkus Dev Services
# auto-provisions an ephemeral Postgres container (requires Docker), owned
# by the connecting role, so RLS never blocks the app in these profiles.
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${LOGTRACK_DB_USER:postgres}
%prod.quarkus.datasource.password=${LOGTRACK_DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${LOGTRACK_DB_URL}

# --- Flyway / Hibernate ---
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=none

# --- CORS (Angular frontend) ---
# Also includes the backend's own origin: /api/leituras is hit directly by
# the ESP32 firmware (not a browser), which sends Origin: {backendOrigin} —
# OriginGuard checks that value, but it must first survive this filter.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${LOGTRACK_CORS_ORIGINS:http://localhost:4200},${logtrack.backend-origin}
quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# --- JWT ---
# Dev/test keys are generated locally in Step 4 and never committed (see
# .gitignore in Step 7). Prod supplies real paths via env vars.
%dev.mp.jwt.verify.publickey.location=dev-publicKey.pem
%dev.smallrye.jwt.sign.key.location=dev-privateKey.pem
%test.mp.jwt.verify.publickey.location=dev-publicKey.pem
%test.smallrye.jwt.sign.key.location=dev-privateKey.pem
mp.jwt.verify.issuer=https://logtrack.local
%prod.mp.jwt.verify.publickey.location=${LOGTRACK_JWT_PUBLIC_KEY_PATH}
%prod.smallrye.jwt.sign.key.location=${LOGTRACK_JWT_PRIVATE_KEY_PATH}

# --- LogTrack-specific config (bound by LogtrackConfig) ---
logtrack.backend-origin=${LOGTRACK_BACKEND_ORIGIN:http://localhost:8080}
logtrack.frontend-url=${LOGTRACK_FRONTEND_URL:http://localhost:4200}
logtrack.uploads-dir=${LOGTRACK_UPLOADS_DIR:uploads}
%dev.logtrack.station-secret=dev-secret-please-change-1234567890ab
%test.logtrack.station-secret=test-secret-please-change-1234567890ab
%prod.logtrack.station-secret=${LOGTRACK_STATION_SECRET}

# --- OpenAPI ---
mp.openapi.extensions.smallrye.info.title=LogTrack API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API do LogTrack (rastreamento de lotes via RFID)

; PlatformIO project config for the LogTrack ESP32 firmware (Wokwi simulation)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    bblanchon/ArduinoJson@^7.2.1
extra_scripts = post:scripts/merge_firmware.py

; Um sensor por zona: mesmo firmware, só o setupUrl (link de ativação da estação)
; muda, via build flag -D SETUP_URL. Cada env builda em .pio/build/zona-x/, e cada
; pasta sim/zona-x/ tem seu próprio wokwi.toml apontando pro binário dessa env
; (diagram.json de fiação é o mesmo copiado em cada pasta, o hardware é idêntico).
; O Wokwi só executa o firmware em UMA board por simulação (mesmo com várias boards
; do mesmo tipo no diagrama, as outras ficam inertes) — por isso são 3 simulações
; separadas, uma por zona, em vez de uma simulação só com 3 boards.
[env:zona-a]
extends = env:esp32dev
build_flags = -D SETUP_URL='"https://logtrack-self.vercel.app/ativar/56076a85108de0009f72ed1e789e47d43bfff86619ae112504ca3bbf605f1219"'

[env:zona-b]
extends = env:esp32dev
build_flags = -D SETUP_URL='"https://logtrack-self.vercel.app/ativar/e24bea326f2a86ee4e9ff2db7a7c474778245a0ef9f03f742ae9a794823db72c"'

[env:zona-c]
extends = env:esp32dev
build_flags = -D SETUP_URL='"https://logtrack-self.vercel.app/ativar/825101cb1b9a9ce071c46c81f21b8749c96dc3fc8b33d43b2e7290af0999da87"'

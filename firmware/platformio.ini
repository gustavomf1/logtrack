; PlatformIO project config for the LogTrack ESP32 firmware (Wokwi simulation)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    bblanchon/ArduinoJson@^7.2.1
extra_scripts = post:scripts/merge_firmware.py

; Um sensor por zona: mesmo firmware, só o PORTAL_TOKEN (token de ativação do portal
; daquela zona, seedado fixo em DevDataSeeder no backend) muda, via build flag
; -D PORTAL_TOKEN. setupUrl é montado em runtime no firmware como BACKEND_HOST +
; "/ativar/" + PORTAL_TOKEN.
;
; BACKEND_HOST aqui é host.wokwi.internal (hostname especial do Wokwi que resolve pro
; computador rodando a simulação - ver https://docs.wokwi.com/guides/esp32-wifi) porque
; o modo de verificação principal deste firmware É a simulação Wokwi, e dentro dela
; "localhost" aponta pro próprio ESP32 virtual, não pro seu PC (dá "Connection reset by
; peer" ao tentar autenticar). Pra gravar em hardware real na mesma rede do backend,
; troque esse -D BACKEND_HOST pelo IP LAN da máquina rodando o backend (ou a URL do seu
; tunnel) antes de compilar - mas NÃO toque em backendOrigin no sketch, que tem que
; continuar igual ao logtrack.backend-origin configurado no backend (ver firmware/CLAUDE.md).
;
; Cada env builda em .pio/build/zona-x/, e cada pasta sim/zona-x/ tem seu próprio
; wokwi.toml apontando pro binário dessa env (diagram.json de fiação é o mesmo
; copiado em cada pasta, o hardware é idêntico). O Wokwi só executa o firmware em
; UMA board por simulação (mesmo com várias boards do mesmo tipo no diagrama, as
; outras ficam inertes) — por isso são 3 simulações separadas, uma por zona, em vez
; de uma simulação só com 3 boards.
[env:zona-a]
extends = env:esp32dev
build_flags =
    -D PORTAL_TOKEN='"cc613c7959d0f0a0eaf5196f307ae667b1fc4f5361c21614722f40784d1eab03"'
    -D BACKEND_HOST='"http://host.wokwi.internal:8080"'

[env:zona-b]
extends = env:esp32dev
build_flags =
    -D PORTAL_TOKEN='"353487c974054727584950814c2c133e7283b8d3a9653766cdbb64c7cf2d624d"'
    -D BACKEND_HOST='"http://host.wokwi.internal:8080"'

[env:zona-c]
extends = env:esp32dev
build_flags =
    -D PORTAL_TOKEN='"dd722dd7ead097675efd114dbb3f0ac47630cd6c5cf2f743882752accdf290b0"'
    -D BACKEND_HOST='"http://host.wokwi.internal:8080"'
